version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js App Router
  - React
  - Tailwind CSS
  - Formik
  - Zod
  - lucide-react
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Root page.
  - path: /sign-in
    file: src/app/(auth)/sign-in/page.tsx
    auth_required: false
    description: UI-only sign-in page.
  - path: /dashboards
    file: src/app/(content)/dashboards/page.tsx
    auth_required: false
    description: Dashboard overview page.
  - path: /data-mapping
    file: src/app/(content)/data-mapping/page.tsx
    auth_required: false
    description: Data mapping page.
  - path: /monitoring
    file: src/app/(content)/monitoring/page.tsx
    auth_required: false
    description: Monitoring page.
  - path: /settings
    file: src/app/(content)/settings/page.tsx
    auth_required: false
    description: Settings page.
  - path: /sync-jobs
    file: src/app/(content)/sync-jobs/page.tsx
    auth_required: false
    description: Sync jobs list and details page.
features:
  - name: Sign-in UI
    description: Users can view a sign-in form with email and password controls. Submission is currently UI-only and simulates work before navigating.
    files:
      - src/app/(auth)/sign-in/page.tsx
      - src/features/auth/components/sign-in-card.tsx
      - src/features/auth/schema.ts
      - src/constants/auth-controls.tsx
    entry_route: /sign-in
    user_interactions:
      - Open the /sign-in page.
      - Verify the email or username input is visible.
      - Verify the password input is visible.
      - Verify the Login button is visible.
      - Click Login with an empty form and confirm validation appears or the user remains on the sign-in page.
    api_calls: []
    auth_required: false
  - name: Dashboard UI
    description: Displays dashboard metrics, charts, recent jobs, notifications, and related operational widgets using mock data.
    files:
      - src/app/(content)/dashboards/page.tsx
      - src/features/dashboard/data/mock-data.ts
      - src/features/dashboard/components/stats-overview.tsx
      - src/features/dashboard/components/activity-chart.tsx
    entry_route: /dashboards
    user_interactions:
      - Open the dashboards page.
      - Scan dashboard metric cards and charts.
      - Review recent jobs and notifications.
    api_calls: []
    auth_required: false
  - name: Sync Jobs UI
    description: Displays sync jobs table, filters, pagination, and detail drawer using mock data.
    files:
      - src/app/(content)/sync-jobs/page.tsx
      - src/features/sync-jobs/components/jobs-table-enhanced.tsx
      - src/features/sync-jobs/components/jobs-filter-bar.tsx
      - src/features/sync-jobs/components/job-detail-drawer.tsx
      - src/features/sync-jobs/data/mock-data.ts
    entry_route: /sync-jobs
    user_interactions:
      - Open the sync jobs page.
      - Filter and browse jobs.
      - Open job details.
      - Change pages.
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Sign-in is UI-only and does not call a real authentication backend.
    location: src/features/auth/components/sign-in-card.tsx
    impact: Tests must not expect real credential validation or successful backend login.
  - issue: Dashboard and sync job data are mock or static UI data.
    location: src/features/dashboard/data/mock-data.ts and src/features/sync-jobs/data/mock-data.ts
    impact: Tests should validate rendering and interactions, not persisted backend state.
