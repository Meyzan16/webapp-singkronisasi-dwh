# Ships every container's stdout (Docker json-file log driver) to Elasticsearch.
# App containers write JSON Lines to stdout (see backend/app/logging_config.py) —
# this decodes that JSON so fields like "level", "service", "event" are searchable
# in Kibana instead of being buried in one opaque "message" string.
# Non-JSON lines (postgres, redis, npm/next output) ship fine too — just as raw text.

filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              json.keys_under_root: true
              json.add_error_key: true
              json.message_key: event

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "agents-trading-logs-%{+yyyy.MM.dd}"

setup.template.name:    "agents-trading-logs"
setup.template.pattern: "agents-trading-logs-*"
setup.ilm.enabled: false

logging.metrics.enabled: false
