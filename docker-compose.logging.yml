# Optional logging stack — Elasticsearch + Kibana + Filebeat.
#
# App containers (postgres/redis/backend/agents/frontend) stay completely stateless
# and have ZERO dependency on this file: they only ever write structured JSON to
# stdout (see backend/app/logging_config.py). Filebeat tails Docker's own
# json-file log driver output and ships it to Elasticsearch — remove this file and
# the app behaves identically, just without centralized log search.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
#
# Kibana UI: http://localhost:5601
#   First time: Stack Management → Data Views → create one on "agents-trading-logs-*"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type:          single-node
      xpack.security.enabled:  "false"
      ES_JAVA_OPTS:             "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    user: root   # needed to read /var/lib/docker/containers and the docker socket
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
