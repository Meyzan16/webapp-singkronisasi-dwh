services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       agents_trading
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agents_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend — FastAPI API server (agents run in separate container) ───────────

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:      postgresql+asyncpg://postgres:postgres@postgres:5432/agents_trading
      REDIS_URL:         redis://redis:6379/0
      AGENTS_STANDALONE: "true"
      LEARNING_STANDALONE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Agents — Standalone autonomous trading agents ────────────────────────────

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agents_trading
      REDIS_URL:    redis://redis:6379/0
      # Latihan model dikerjakan container `learning`, bukan di sini — satu putaran
      # menahan event loop 94-129 detik dan akan membuat scanner/monitor ikut telat.
      LEARNING_STANDALONE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Learning — latihan model berat, sengaja diisolasi ────────────────────────
  #
  # Kenapa container sendiri: melatih model atas ledger ratusan ribu baris adalah
  # kerja Python murni yang MENAHAN event loop-nya sampai 94-129 detik. Selama itu
  # proses yang menampungnya tak menjawab apa pun. `asyncio.to_thread` tidak
  # menolong (GIL), jadi satu-satunya pemisah nyata adalah proses terpisah.
  # Container ini boleh membeku sesukanya — tak ada yang menunggu jawabannya.

  learning:
    build:
      context: .
      dockerfile: agents/Dockerfile
    command: ["python", "-m", "agents.learning"]
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agents_trading
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend — Next.js (standalone output) ───────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
